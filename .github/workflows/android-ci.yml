name: Android CI

on:
  push:
    branches: [android-dev]
    paths:
      - "android/**"
      - "ios/MedicationApp/Assets.xcassets/RolePatient.imageset/**"
      - "ios/MedicationApp/Assets.xcassets/RoleFamily.imageset/**"
      - "ios/MedicationApp/Assets.xcassets/AppIcon.appiconset/**"
      - "docs/android/play-store-listing-ja.md"
      - "docs/android/play-store-assets/**"
      - ".github/workflows/android-ci.yml"
  pull_request:
    branches: [main, staging]
    paths:
      - "android/**"
      - "ios/MedicationApp/Assets.xcassets/RolePatient.imageset/**"
      - "ios/MedicationApp/Assets.xcassets/RoleFamily.imageset/**"
      - "ios/MedicationApp/Assets.xcassets/AppIcon.appiconset/**"
      - "docs/android/play-store-listing-ja.md"
      - "docs/android/play-store-assets/**"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    env:
      FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
      FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
      FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Android CI runtime contract
        run: ./gradlew verifyAndroidCiRuntimeContract

      - name: Fetch main merge baseline
        run: git -C .. fetch --no-tags origin main:refs/remotes/origin/main

      - name: Main merge surface
        run: ./gradlew verifyMainMergeSurface

      - name: Residual release gates
        run: ./gradlew verifyReleaseGates

      - name: Firebase runtime
        if: github.event_name == 'push'
        run: ./gradlew verifyFirebaseRuntime

      - name: Runtime credential safety
        run: ./gradlew verifyRuntimeCredentialSafety

      - name: Signed bundle verifier contract
        run: scripts/test-verify-signed-aab.sh

      - name: Upload keystore verifier contract
        run: ./gradlew verifyUploadKeystoreContract

      - name: Production App Links verifier contract
        run: ./gradlew verifyProductionAppLinksContract

      - name: Release evidence policy contract
        run: python3 scripts/test-generate-release-evidence.py

      - name: Play release handoff contract
        run: python3 scripts/test-prepare-play-release-handoff.py

      - name: Play upload receipt contract
        run: ./gradlew verifyPlayUploadReceiptContract

      - name: Release manifest policy contract
        run: python3 scripts/test-verify-release-manifest-policy.py

      - name: Release SDK and Data safety policy
        run: ./gradlew verifyReleaseSdkPolicy

      - name: Connected shard runner contract
        run: |
          bash -n scripts/run-connected-ui-shards.sh scripts/test-run-connected-ui-shards.sh
          scripts/test-run-connected-ui-shards.sh
          scripts/run-connected-ui-shards.sh --help >/dev/null
          if ANDROID_UI_TEST_SHARDS=0 scripts/run-connected-ui-shards.sh >/dev/null 2>&1; then
            echo "Invalid shard count unexpectedly passed."
            exit 1
          fi
          if ANDROID_UI_TEST_SHARDS=4 ANDROID_UI_TEST_SHARD_INDEX=4 scripts/run-connected-ui-shards.sh >/dev/null 2>&1; then
            echo "Invalid shard index unexpectedly passed."
            exit 1
          fi

      - name: Unit tests (Debug and Release)
        run: ./gradlew testDebugUnitTest testReleaseUnitTest

      - name: Debug build
        run: ./gradlew assembleDebug

      - name: Lint
        run: ./gradlew lintDebug

      - name: Release compatibility
        run: ./gradlew verifyReleaseApkCompatibility

      - name: Release AAB content
        run: ./gradlew verifyReleaseBundleContent

      - name: Release AAB install surface
        run: ./gradlew verifyReleaseBundleInstallSurface

      - name: Release device split surfaces
        run: ./gradlew verifyReleaseDeviceSplitSurface

      - name: Play listing assets
        run: ./gradlew verifyPlayStoreAssets
