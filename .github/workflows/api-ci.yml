name: API CI

on:
  push:
    branches: [main, staging, android-dev]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/api-e2e.yml"
      - ".github/workflows/android-api-production-release.yml"
  pull_request:
    branches: [main, staging, android-dev]
    paths:
      - "api/**"
      - ".github/workflows/api-ci.yml"
      - ".github/workflows/api-e2e.yml"
      - ".github/workflows/android-api-production-release.yml"

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  # ── Lint, Format, Typecheck ────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    env:
      DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Android production release contract
        run: |
          node scripts/test-verify-android-production-release.mjs
          node scripts/test-prepare-android-production-database.mjs

      - name: API Node runtime contract
        run: |
          node scripts/test-verify-api-node-runtime.mjs
          node scripts/verify-api-node-runtime.mjs

      - name: Production dependency audit
        run: npm audit --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format

      - name: TypeScript
        run: npm run typecheck

  # ── Unit / Integration / Contract Tests ────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: med_manager
          POSTGRES_PASSWORD: med_manager
          POSTGRES_DB: med_manager_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U med_manager -d med_manager_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://med_manager:med_manager@localhost:54329/med_manager_test
      DIRECT_URL: postgresql://med_manager:med_manager@localhost:54329/med_manager_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Bootstrap Supabase PostgreSQL objects
        run: npx prisma db execute --file scripts/ci-bootstrap-postgres.sql

      - name: Android mutation migration upgrade contract
        run: |
          node scripts/test-verify-android-mutation-migration.mjs
          node scripts/verify-android-mutation-migration.mjs

      - name: Android mutation deployment audit contract
        run: node scripts/test-verify-android-mutation-deployment.mjs

      - name: Run Migrations
        run: npx prisma migrate deploy

      - name: Android mutation postdeploy audit
        env:
          ANDROID_MUTATION_DEPLOYMENT_AUDIT: postdeploy
        run: node scripts/verify-android-mutation-deployment.mjs --mode postdeploy

      - name: Run Tests
        run: npm test

  # ── Build ──────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    env:
      DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
      DIRECT_URL: postgresql://dummy:dummy@localhost:5432/dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
